# Render Blueprint für AHV-Digital
# Starter-Plan mit Persistent Disk: SQLite-DB, Uploads (Fotos/Logo) und
# Backups liegen unter /opt/render/project/src/data und überleben Deploys.
services:
  - type: web
    name: ahv-digital
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      # JWT-Secret wird von Render einmalig generiert und gemerkt — Tokens
      # bleiben dadurch ueber Deploys hinweg gueltig.
      - key: JWT_SECRET
        generateValue: true
      # Explizit auf den Disk-Mount zeigen. Uploads (Fotos/Logo) und Backups
      # leiten sich im Server vom DB-Verzeichnis ab:
      #   dirname(DB_PATH)/uploads  bzw.  dirname(DB_PATH)/backups
      - key: DB_PATH
        value: /opt/render/project/src/data/ahv.db
    disk:
      name: ahv-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
