# Render Blueprint für AHV-Digital
# Phase 1.1: Free-Plan (zum Testen). Persistent Disk fehlt absichtlich,
# wird in 1.2 zusammen mit dem Wechsel auf Starter ergänzt.
services:
  - type: web
    name: ahv-digital
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # --include=dev erzwingt devDeps (Vite, TS, tsc), die wir zum Bauen
    # brauchen. Ohne den Flag skipt npm sie wegen NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      # Render setzt NODE_ENV=production, was npm beim npm ci dazu bringt,
      # devDependencies (Vite, tsc) zu skippen. NPM_CONFIG_INCLUDE=dev kehrt
      # das um — ohne den Server-Runtime-Modus zu beruehren.
      - key: NPM_CONFIG_INCLUDE
        value: dev
    # disk:
    #   name: ahv-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
